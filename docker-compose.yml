services:
    app:
        build:
            args:
                user: user-docker
                uid: "${UID:-1000}"
                gid: "${GID:-1000}"
            context: .
            dockerfile: Dockerfile
        image: challenge-app
        container_name: challenge-api
        restart: unless-stopped
        working_dir: /var/www
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            XDEBUG_MODE: "${XDEBUG_MODE:-debug}"
            XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 idekey=docker"
        volumes:
            - ./:/var/www
            - ./docker/php/php-local.ini:/usr/local/etc/php/conf.d/php-local.ini
            - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - challenge

    nginx:
        image: nginx:alpine
        container_name: challenge-nginx
        restart: unless-stopped
        ports:
            - "9090:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - challenge

networks:
    challenge:
        driver: bridge
